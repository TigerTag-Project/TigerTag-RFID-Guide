name: Sync TigerTag database

on:
  schedule:
    # Every 6 hours. Adjust the cron if you want a different cadence.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-database
  cancel-in-progress: false

env:
  # Opt in to Node.js 24 for JavaScript actions ahead of the June 2026
  # forced cutover (see github.blog/changelog/2025-09-19-deprecation-of-node-20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --no-cache-dir requests

      - name: Run incremental sync
        run: python database/db_update.py

      # One file per brand under database/brands/, from the catalogue just synced.
      # No network; only the brands whose products changed are rewritten.
      - name: Split the catalogue by brand
        run: python database/split_catalog.py

      - name: Commit and push if changes
        id: commit
        run: |
          if [[ -z "$(git status --porcelain database/)" ]]; then
            echo "No dataset changes — nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add database/

          # The brand files are summed up as one entry, so a catalogue change that
          # touches forty brands still gives a readable commit title.
          changed=$(git diff --cached --name-only | grep -v '^database/brands/' | xargs -r -n1 basename | paste -sd ',' - | sed 's/,/, /g')
          brands=$(git diff --cached --name-only -- database/brands/ | wc -l | tr -d ' ')
          if [[ "$brands" -gt 0 ]]; then
            changed="${changed:+$changed, }brands/ (${brands} files)"
          fi
          git commit -m "Auto-sync database: ${changed}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Tell the site the snapshot may have moved, so a new product shows up on
      # tigersystem.io within minutes instead of at its next hourly regeneration.
      # Safe to call every run: the endpoint asks GitHub itself which commit is
      # current and does nothing when the site is already built on it. Never
      # fatal — the site also checks on its own every hour, so a missed call
      # only costs time.
      - name: Tell tigersystem.io to look
        if: always()
        run: |
          curl --silent --show-error --max-time 60 -X POST \
            https://tigersystem.io/api/catalog/refresh || echo "Hub not reachable — it will catch up on its hourly check."

      # tigersystem.io keeps a mirror of this database as static files (its
      # /database/ fallback endpoint and the playground's data), refreshed when
      # the site is built. So when this run really changed the data — a new
      # brand, a corrected product — rebuild the site at once through its Vercel
      # Deploy Hook. A rebuild only rebuilds what is already on the site's main
      # branch: no unreleased code goes live. Skipped when nothing changed, and
      # when the HUB_DEPLOY_HOOK secret is not set.
      - name: Rebuild tigersystem.io when the data changed
        if: steps.commit.outputs.changed == 'true'
        env:
          HUB_DEPLOY_HOOK: ${{ secrets.HUB_DEPLOY_HOOK }}
        run: |
          if [[ -z "$HUB_DEPLOY_HOOK" ]]; then
            echo "HUB_DEPLOY_HOOK is not set — the mirror refreshes at the site's next build."
            exit 0
          fi
          curl --silent --show-error --fail --max-time 60 -X POST "$HUB_DEPLOY_HOOK" > /dev/null \
            && echo "tigersystem.io rebuild requested." \
            || echo "Deploy hook did not answer — the mirror refreshes at the site's next build."
